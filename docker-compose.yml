# 개발용 인프라: PostgreSQL(카드팩·기록) + Redis(게임 상태·세션·타이머)
# 실행: docker compose up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: cardbattle
      POSTGRES_USER: cardbattle
      POSTGRES_PASSWORD: cardbattle
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardbattle -d cardbattle"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
